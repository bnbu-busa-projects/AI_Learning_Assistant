<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Learning Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151411;
        --panel: #23231e;
        --ink: #f2eee4;
        --muted: #b8ae9a;
        --line: #403d34;
        --accent: #c97752;
        --paper: #f3ecda;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(115deg, rgb(201 119 82 / 14%), transparent 42%),
          linear-gradient(180deg, #1b1915, var(--bg));
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(720px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid rgb(243 236 218 / 16%);
        border-radius: 8px;
        background: rgb(35 35 30 / 86%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 32%);
      }

      h1 {
        margin: 0;
        color: var(--paper);
        font-family: Georgia, "Times New Roman", "Noto Serif", serif;
        font-size: 30px;
        font-weight: 650;
        line-height: 1.1;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .status {
        margin-top: 22px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #181814;
      }

      .state-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--paper);
        font-weight: 750;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgb(201 119 82 / 20%);
      }

      code,
      pre {
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      pre {
        max-height: 180px;
        overflow: auto;
        margin: 14px 0 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: #ddd2bf;
        background: #11110f;
        white-space: pre-wrap;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      button {
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid rgb(243 236 218 / 18%);
        border-radius: 6px;
        background: #2b2a24;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
      }

      button.primary {
        border-color: rgb(201 119 82 / 70%);
        background: rgb(201 119 82 / 20%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Learning Assistant</h1>
      <p>The desktop shell is preparing the local Docker runtime and waiting for the workbench backend.</p>
      <section class="status" aria-live="polite">
        <div class="state-row">
          <span class="dot"></span>
          <span id="state">checking_docker</span>
        </div>
        <p id="message">Checking Docker Desktop availability.</p>
        <pre id="details" hidden></pre>
      </section>
      <div class="actions">
        <button class="primary" id="retry" type="button">Retry</button>
        <button id="diagnostics" type="button">Open diagnostics folder</button>
      </div>
    </main>
    <script src="./shell-renderer.js"></script>
  </body>
</html>
